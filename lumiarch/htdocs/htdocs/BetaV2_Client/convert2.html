<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Galaxia to Lumisle v4 Converter</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        .container { display: flex; gap: 20px; height: 75vh; }
        textarea { flex: 1; background: #252526; color: #9cdcfe; border: 1px solid #333; padding: 10px; font-family: 'Consolas', monospace; border-radius: 4px; resize: none; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 25px; background: #007acc; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #005a9e; }
        h2 { margin: 0 0 15px 0; color: #569cd6; text-align: center; }
    </style>
</head>
<body>

    <h2>Galaxia to Lumisle v4 Converter</h2>
    
    <div class="container">
        <textarea id="inputXml" placeholder="Paste Galaxia XML here..."></textarea>
        <textarea id="outputXml" placeholder="Lumisle XML will appear here..." readonly></textarea>
    </div>

    <div class="controls">
        <button onclick="convertXml()">Convert Now</button>
        <button onclick="copyOutput()" style="background: #3c3c3c;">Copy XML</button>
    </div>

    <script>
        function hexToRgb(hex) {
            if (!hex || !hex.startsWith('#')) return hex; 
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        function convertXml() {
            const input = document.getElementById('inputXml').value;
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(input, "text/xml");
            
            if (xmlDoc.getElementsByTagName("parsererror").length > 0) {
                alert("XML Error. Check your tags.");
                return;
            }

            let output = `<?xml version="1.0" encoding="UTF-8"?>\n<lumisle xml-version="4">\n`;

            const root = xmlDoc.querySelector('galaxia') || xmlDoc.querySelector('lumisle') || xmlDoc.documentElement;
            const topItems = Array.from(root.children).filter(node => node.tagName.toLowerCase() === 'item');
            
            topItems.forEach(item => {
                output += processItem(item, 1, "N/A");
            });

            output += `</lumisle>`;
            document.getElementById('outputXml').value = output;
        }

        function processItem(item, indent, parentId) {
            const tabs = "    ".repeat(indent);
            const className = item.getAttribute('className') || "Part";
            
            let currentIdForChildren = parentId;
            if (className === "Workspace") currentIdForChildren = "Workspace1";
            if (className === "Lighting") currentIdForChildren = "Lighting1";
            
            let xml = `${tabs}<Item class="${className}">\n`;
            xml += `${tabs}    <Properties>\n`;

            // Structural Headers
            if (className === "Workspace") {
                xml += `${tabs}        <Name>Workspace</Name>\n`;
                xml += `${tabs}        <UniqueHex>Workspace1</UniqueHex>\n`;
            } else if (className === "Lighting") {
                xml += `${tabs}        <Name>Lighting</Name>\n`;
                xml += `${tabs}        <UniqueHex>Lighting1</UniqueHex>\n`;
            } else {
                xml += `${tabs}        <Parent>${parentId}</Parent>\n`;
            }

            const propsElement = Array.from(item.children).find(c => c.tagName.toLowerCase() === 'properties');
            let capturedProps = {};

            if (propsElement) {
                Array.from(propsElement.children).forEach(p => {
                    const tag = p.tagName.toLowerCase();
                    const valAttr = p.getAttribute('value');
                    const content = p.textContent.trim();
                    const finalVal = valAttr || content;

                    if (tag === "position" || tag === "size") {
                        const x = parseFloat(p.getAttribute('X') || 0).toFixed(3);
                        const y = parseFloat(p.getAttribute('Y') || 0).toFixed(3);
                        const z = parseFloat(p.getAttribute('Z') || 0).toFixed(3);
                        const pascal = tag.charAt(0).toUpperCase() + tag.slice(1);
                        xml += `${tabs}        <${pascal}>${x}, ${y}, ${z}</${pascal}>\n`;
                        capturedProps[pascal] = true;
                    } 
                    else if (tag === "rotation") {
                        const x = p.getAttribute('X') || "0";
                        const y = p.getAttribute('Y') || "0";
                        const z = p.getAttribute('Z') || "0";
                        xml += `${tabs}        <Orientation>${x}, ${y}, ${z}</Orientation>\n`;
                        capturedProps["Orientation"] = true;
                    }
                    else if (tag === "brickcolor" || tag === "color") {
                        xml += `${tabs}        <Color3>${hexToRgb(finalVal)}</Color3>\n`;
                        capturedProps["Color3"] = true;
                    }
                    else if (tag === "ambient") {
                        xml += `${tabs}        <Ambient>${hexToRgb(finalVal)}</Ambient>\n`;
                        capturedProps["Ambient"] = true;
                    }
                    else if (tag === "unique-id" || tag === "uniquehex") {
                        xml += `${tabs}        <UniqueHex>${finalVal}</UniqueHex>\n`;
                        capturedProps["UniqueHex"] = true;
                    }
                    else if (tag === "surface") {
                        const top = p.getAttribute('topsurface') || "Smooth";
                        const bot = p.getAttribute('bottomsurface') || "Smooth";
                        const front = p.getAttribute('frontsurface') || "Smooth";
                        const back = p.getAttribute('backsurface') || "Smooth";
                        const left = p.getAttribute('leftsurface') || "Smooth";
                        const right = p.getAttribute('rightsurface') || "Smooth";
                        xml += `${tabs}        <Surface top="${top}" bottom="${bot}" front="${front}" back="${back}" right="${right}" left="${left}"/>\n`;
                        capturedProps["Surface"] = true;
                    }
                    else {
                        const pascalTag = tag.charAt(0).toUpperCase() + tag.slice(1);
                        // Filter out names for Workspace/Lighting as we hardcode those
                        if (!(pascalTag === "Name" && (className === "Workspace" || className === "Lighting"))) {
                            xml += `${tabs}        <${pascalTag}>${finalVal}</${pascalTag}>\n`;
                            capturedProps[pascalTag] = true;
                        }
                    }
                });
            }

            // Defaults for Parts/SpawnLocations if they were missing from input
            if (className === "Part" || className === "SpawnLocation") {
                if (!capturedProps["Size"]) xml += `${tabs}        <Size>4.000, 2.000, 1.000</Size>\n`;
                if (!capturedProps["Material"]) xml += `${tabs}        <Material>Plastic</Material>\n`;
                if (!capturedProps["Transparency"]) xml += `${tabs}        <Transparency>0</Transparency>\n`;
                if (!capturedProps["CastShadow"]) xml += `${tabs}        <CastShadow>true</CastShadow>\n`;
                if (!capturedProps["Locked"]) xml += `${tabs}        <Locked>false</Locked>\n`;
                if (!capturedProps["UniqueHex"]) xml += `${tabs}        <UniqueHex>N/A</UniqueHex>\n`;
            }

            // Workspace/Lighting extra mandatory fields
            if (className === "Workspace") {
                if (!capturedProps["FallenPartsDestroyHeight"]) xml += `${tabs}        <FallenPartsDestroyHeight>-500</FallenPartsDestroyHeight>\n`;
            } else if (className === "Lighting") {
                if (!capturedProps["Timeofday"]) xml += `${tabs}        <Timeofday>14</Timeofday>\n`;
                if (!capturedProps["GlobalShadows"]) xml += `${tabs}        <GlobalShadows>true</GlobalShadows>\n`;
            }

            xml += `${tabs}    </Properties>\n`;

            // Recurse through nested items
            const childItems = Array.from(item.children).filter(node => node.tagName.toLowerCase() === 'item');
            childItems.forEach(child => {
                xml += processItem(child, indent + 1, currentIdForChildren);
            });

            xml += `${tabs}</Item>\n`;
            return xml;
        }

        function copyOutput() {
            const output = document.getElementById('outputXml');
            output.select();
            document.execCommand('copy');
        }
    </script>
</body>
</html>
