<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <title>Lumisle</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial Black', Gadget, sans-serif; }
        canvas { display: block; }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        #ui-layer > * { pointer-events: auto; }

        /* --- Menu Toggle Button --- */
        #menu-toggle {
            position: absolute;
            top: 5px;
            left: 5px;
            padding: 5px 12px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid #666;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        /* --- Classic Game Menu Overlay --- */
        #menu-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Dim the whole background */
            pointer-events: auto;
        }

        #menu-modal.open { display: flex; align-items: center; justify-content: center; }

        /* The Box */
        #menu-content {
            width: 480px; 
            background: rgba(35, 35, 35, 0.9);
            border: 1px solid #000;
            padding: 25px;
            box-sizing: border-box;
            text-align: center;
        }

        #menu-title {
            color: white;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 30px;
            display: block;
            text-shadow: 2px 2px 0px #000;
        }

        /* --- Button Styling --- */
        .menu-btn {
            width: 100%;
            padding: 15px 0;
            margin-bottom: 12px;
            background: #777;
            border: 2px solid #111;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .menu-btn:hover { background: #999; }

        .btn-primary { 
            background: #5a85ff; 
            border-color: #1e3580;
        }
        .btn-primary:hover { background: #7ba0ff; }

        /* Row for Help and Screenshot */
        .menu-row {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .menu-row .menu-btn { margin-bottom: 0; flex: 1; }

        /* --- Health Bar --- */
        #health-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 22px;
            background: #444;
            border: 3px solid #000;
        }

        #health-fill {
            width: 100%;
            height: 100%;
            background: #00e600; 
        }

        #health-text {
            position: absolute;
            top: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 13px;
            font-weight: bold;
            line-height: 22px;
            text-shadow: 1px 1px 1px #000;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <button id="menu-toggle" onclick="toggleMenu()">MENU</button>

        <div id="menu-modal">
            <div id="menu-content">
                <span id="menu-title">Game Menu</span>
                
                <button class="menu-btn btn-primary" onclick="toggleMenu()">Resume Game</button>
                <button class="menu-btn" onclick="resetCharacter()">Reset Character</button>
                <button class="menu-btn">Game Settings</button>

                <div class="menu-row">
                    <button class="menu-btn">Help</button>
                    <button class="menu-btn" onclick="takeScreenshot()">Screenshot</button>
                </div>

                <button class="menu-btn" onclick="window.location.href='../index.php'">Leave Game</button>
            </div>
        </div>

        <div id="health-container">
            <div id="health-fill"></div>
            <div id="health-text">HEALTH</div>
        </div>
    </div>

    <script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/loaders/OBJLoader.js": "https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js",
        "three/examples/jsm/geometries/DecalGeometry.js": "https://unpkg.com/three@0.160.0/examples/jsm/geometries/DecalGeometry.js",
        "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
}
</script>
    <script type="module" src="code/engine.js"></script>
</body>
</html>
