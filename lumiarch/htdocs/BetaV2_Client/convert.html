<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Galaxia to Lumisle XML Converter</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e1e; color: #d4d4d4; padding: 20px; }
        .container { display: flex; gap: 20px; height: 75vh; }
        textarea { flex: 1; background: #252526; color: #9cdcfe; border: 1px solid #333; padding: 10px; font-family: 'Consolas', monospace; border-radius: 4px; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; }
        button { padding: 10px 25px; background: #007acc; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #005a9e; }
        h2 { margin: 0 0 15px 0; color: #569cd6; text-align: center; }
    </style>
</head>
<body>

    <h2>Galaxia to Lumisle v3 Converter</h2>
    
    <div class="container">
        <textarea id="inputXml" placeholder="Paste Galaxia XML here..."></textarea>
        <textarea id="outputXml" placeholder="Lumisle XML will appear here..." readonly></textarea>
    </div>

    <div class="controls">
        <button onclick="convertXml()">Convert Now</button>
        <button onclick="copyOutput()" style="background: #3c3c3c;">Copy XML</button>
    </div>

    <script>
        function hexToRgb(hex) {
            if (!hex || !hex.startsWith('#')) return hex; // Return as-is if already RGB or invalid
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `${r}, ${g}, ${b}`;
        }

        function convertXml() {
            const input = document.getElementById('inputXml').value;
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(input, "text/xml");
            
            if (xmlDoc.getElementsByTagName("parsererror").length > 0) {
                alert("XML Error. Check your tags.");
                return;
            }

            let output = `<?xml version="1.0" encoding="UTF-8"?>\n<lumisle xml-version="3">\n`;

            // Process all top-level items (Workspace, Lighting, etc.)
            const topItems = xmlDoc.querySelectorAll('galaxia > item');
            topItems.forEach(item => {
                output += processItem(item, 1);
            });

            output += `</lumisle>`;
            document.getElementById('outputXml').value = output;
        }

        function processItem(item, indent) {
            const tabs = "    ".repeat(indent);
            const className = item.getAttribute('className');
            
            let xml = `${tabs}<item class="${className}">\n`;
            xml += `${tabs}    <properties>\n`;

            const props = item.querySelector(':scope > properties');
            if (props) {
                Array.from(props.children).forEach(p => {
                    const tag = p.tagName.toLowerCase();
                    let content = p.textContent.trim();

                    // 1. Vector3 (Position, Size, Rotation)
                    if (tag === "position" || tag === "size" || tag === "rotation") {
                        const x = p.getAttribute('X') || "0";
                        const y = p.getAttribute('Y') || "0";
                        const z = p.getAttribute('Z') || "0";
                        xml += `${tabs}        <${tag}>${x}, ${y}, ${z}</${tag}>\n`;
                    } 
                    // 2. Colors (brickcolor, ambient)
                    else if (tag === "brickcolor" || tag === "ambient") {
                        const finalTag = (tag === "brickcolor") ? "color" : "ambient";
                        // Check if color is in value attribute OR inner text
                        const colorValue = p.getAttribute('value') || content;
                        xml += `${tabs}        <${finalTag}>${hexToRgb(colorValue)}</${finalTag}>\n`;
                    }
                    // 3. Surface Mapping
                    else if (tag === "surface") {
                        const top = p.getAttribute('topsurface') || "Smooth";
                        const bot = p.getAttribute('bottomsurface') || "Smooth";
                        xml += `${tabs}        <surface top="${top}" bottom="${bot}" front="Smooth" back="Smooth" right="Smooth" left="Smooth"/>\n`;
                    }
                    // 4. Value-based properties (Gravity, Brightness)
                    else if (p.hasAttribute('value')) {
                        xml += `${tabs}        <${tag}>${p.getAttribute('value')}</${tag}>\n`;
                    }
                    // 5. General Text
                    else {
                        xml += `${tabs}        <${tag}>${content}</${tag}>\n`;
                    }
                });
            }

            xml += `${tabs}    </properties>\n`;

            // Process Nested Items
            const children = item.querySelectorAll(':scope > item');
            children.forEach(child => {
                xml += processItem(child, indent + 1);
            });

            xml += `${tabs}</item>\n`;
            return xml;
        }

        function copyOutput() {
            const output = document.getElementById('outputXml');
            output.select();
            document.execCommand('copy');
        }
    </script>
</body>
</html>
