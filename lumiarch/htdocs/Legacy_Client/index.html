<!DOCTYPE html>
<html>
<head>
    <title>Galaxia Engine</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        @font-face {
  font-family: comicsans;
  src: url(assets/fonts/comic.ttf);
}

        
        body, html { 
    margin: 0; 
    padding: 0; 
    overflow: hidden; 
    width: 100%; 
    height: 100%; 
    background-color: #000;
    position: fixed; 
}
        
        #gui-container {
    position: fixed; 
    top: 0;
    left: 0;
    width: 100%;
    z-index: 3000;
    display: flex;
    opacity: 1;
    touch-action: none; 
}

        .gui-button {
  			border: none;
  			color: rgb(28, 28, 28);
            background: rgba(199, 199, 199, 0.3);
		 	padding: 5px 35px;
		  	text-align: left;
            font-family: comicsans;
		  	text-decoration: none;
		  	display: inline-block;
		  	font-size: 16px;
		  	cursor: pointer;
		}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/three-rounded-box@1.0.0/dist/three-rounded-box.min.js"></script>
</head>
<body>

    <div id="gui-container">
        <button id="btn-fullscreen" class="gui-button">Fullscreen</button>
        <button id="btn-info" class="gui-button">Help</button>
        <button id="btn-exit" class="gui-button">Exit</button>
    </div>

    <input type="file" id="map-loader" style="display: none;" accept=".xml">

    <div id="viewport-container">
        <div id="viewport"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script src="main.js"></script>
    <script src="cameraControl.js"></script>
    <script src="player.js"></script>
    <script src="gui.js"></script>
    <script src="loadmap.js"></script>
    <script src="mobile.js"></script>
</body>
</html>
